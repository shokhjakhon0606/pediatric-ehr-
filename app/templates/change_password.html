{% extends "base.html" %}
{% block content %}

<div class="ehr-card p-4 mb-3">
  <div class="d-flex justify-content-between align-items-center">
    <div>
      <h2 class="ehr-title mb-1">Change Password</h2>
      <div class="ehr-muted">Use a strong password</div>
    </div>
    <a class="btn btn-outline-secondary" href="{{ url_for('main.profile') }}">Back</a>
  </div>
</div>

<div class="ehr-card p-4">
  <form method="POST">
    <div class="row g-3">

      <div class="col-md-6">
        <label class="form-label">Current Password</label>
        <input class="form-control" type="password" name="current_password" required>
      </div>

      <div class="col-md-6">
        <label class="form-label">New Password</label>
        <input class="form-control" type="password" name="new_password" required minlength="6">
        <div class="ehr-muted mt-1">Minimum 6 characters.</div>
      </div>

      <div class="col-12 d-flex gap-2">
        <button class="btn btn-primary" type="submit">Update Password</button>
        <a class="btn btn-outline-secondary" href="{{ url_for('main.profile') }}">Cancel</a>
      </div>

    </div>
  </form>
</div>

{% endblock %}
