{% extends "base.html" %}
{% block content %}

<div class="ehr-card p-4 mb-3">
  <div class="d-flex justify-content-between align-items-center">
    <div>
      <h2 class="ehr-title mb-1">Edit Patient</h2>
      <div class="ehr-muted">Update patient record</div>
    </div>
    <a class="btn btn-outline-secondary" href="{{ url_for('main.patient_detail', patient_id=patient.id) }}">Back</a>
  </div>
</div>

<div class="ehr-card p-4">
  <form method="POST" enctype="multipart/form-data">
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label">Full Name</label>
        <input class="form-control" name="full_name" value="{{ patient.full_name }}" required>
      </div>

      <div class="col-md-6">
        <label class="form-label">Birth Date</label>
        <input class="form-control" type="date" name="birth_date" value="{{ patient.birth_date }}" required>
      </div>

      <div class="col-md-6">
        <label class="form-label">Gender</label>
        <select class="form-select" name="gender">
          <option value="" {% if not patient.gender %}selected{% endif %}>Select</option>
          <option value="Male" {% if patient.gender == 'Male' %}selected{% endif %}>Male</option>
          <option value="Female" {% if patient.gender == 'Female' %}selected{% endif %}>Female</option>
          <option value="Other" {% if patient.gender == 'Other' %}selected{% endif %}>Other</option>
        </select>
      </div>

      <div class="col-md-6">
  <label class="form-label">Photo</label>

  {% if patient.image_path %}
    <div class="d-flex align-items-center gap-3 flex-wrap mb-2">
      <img
        src="{{ url_for('static', filename=patient.image_path) }}"
        alt="Patient photo"
        style="width: 110px; height: 110px; object-fit: cover; border-radius: 16px; border: 1px solid rgba(0,0,0,.10);"
      >

      <div>
        <div class="ehr-muted mb-2">Current photo is shown. You can remove it or upload a new one.</div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="remove_photo" name="remove_photo">
          <label class="form-check-label text-danger" for="remove_photo">
            Remove current photo
          </label>
        </div>
      </div>
    </div>
  {% else %}
    <div class="ehr-muted mb-2">No photo uploaded.</div>
  {% endif %}

  <input class="form-control" type="file" name="photo" accept="image/*">
</div>

      <div class="col-12">
        <label class="form-label">Allergies</label>
        <input class="form-control" name="allergies" value="{{ patient.allergies or '' }}">
      </div>

      <div class="col-12">
        <label class="form-label">Medical History</label>
        <textarea class="form-control" rows="5" name="medical_history">{{ patient.medical_history or '' }}</textarea>
      </div>

      <div class="col-12 d-flex gap-2">
        <button class="btn btn-primary" type="submit">Save Changes</button>
        <a class="btn btn-outline-secondary" href="{{ url_for('main.patient_detail', patient_id=patient.id) }}">Cancel</a>
      </div>
    </div>
  </form>
</div>

{% endblock %}
