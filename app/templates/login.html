{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="ehr-card p-4">
      <h2 class="ehr-title mb-1 text-center">Doctor Login</h2>
      <div class="ehr-muted text-center mb-4">Login with email or username</div>

      <form method="POST" action="{{ url_for('main.login') }}">
        <div class="mb-3">
          <label class="form-label">Email or Username</label>
          <input type="text" class="form-control" name="email" placeholder="admin@ehr.com or admin" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Password</label>
          <input type="password" class="form-control" name="password" required>
        </div>

        <button type="submit" class="btn btn-primary w-100">Login</button>
      </form>

      <p class="text-center mt-3 mb-0">
        Don’t have an account?
        <a href="{{ url_for('main.register') }}">Register</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
